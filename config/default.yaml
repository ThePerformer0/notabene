# NotaBene Configuration File

# Database settings
database:
  path: ~/.notabene/notabene.db

# Storage settings
storage:
  pdf_directory: ~/.notabene/pdfs

# Extraction settings
extraction:
  pdf:
    max_pages_for_abstract: 3
    abstract_keywords:
      - abstract
      - résumé
      - summary
  web:
    timeout: 30
    user_agent: "NotaBene/0.1.0"

# Search settings
search:
  max_results: 50
