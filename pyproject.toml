[project]
name = "notabene"
version = "0.1.0"
description = "Assistant intelligent de recherche académique (RAG local)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pymupdf>=1.24",
    "trafilatura>=1.9",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
notab = "notabene.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["notabene*"]