[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notabene"
version = "0.1.0"
description = "A CLI tool for organizing research sources and notes"
readme = "README.md"
authors = [
    {name = "Votre Nom", email = "votre@email.com"},
]
license = "MIT"
keywords = ["research", "academic", "notes", "pdf", "organizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Education",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0.0",
    "sqlalchemy>=2.0.0",
    "pdfplumber>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ThePerformer0/notabene"
Documentation = "https://github.com/ThePerformer0/notabene/docs"
Repository = "https://github.com/ThePerformer0/notabene"
Issues = "https://github.com/ThePerformer0/notabene/issues"

[project.scripts]
notab = "notabene.cli.main:cli"
nb = "notabene.cli.main:cli"

[tool.setuptools]
packages = ["notabene"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true